<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 727 — Court Shot Cards Back</title>
  <link rel="stylesheet" href="../_print.css" />
  <style>
    .card-grid { width: 7.5in; height: 10.5in; display: grid; grid-template-columns: repeat(3, 2.5in); grid-template-rows: repeat(3, 3.5in); margin: 0 auto; }
    .shot-card { display: grid; place-items: center; padding: .25in; background: #f5f8f5; text-align: center; }
    .coordinate { width: 1.45in; height: 1.45in; display: grid; place-items: center; margin: .18in auto; border: 2px solid var(--green); color: var(--green); font: 700 38px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .shot-card p { margin: 0; color: var(--muted); font: 9px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .blank { border: 1px dashed #ccd4cf; }
  </style>
</head>
<body>
  <main class="sheet">
    <i class="registration tl"></i><i class="registration tr"></i><i class="registration bl"></i><i class="registration br"></i>
    <div id="cards" class="card-grid"></div>
    <div class="print-meta">Court cards — backs // duplex long-edge // 100%</div>
  </main>
  <script src="../../shared/game-config.js"></script>
  <script>
    const backs = PROJECT727_CONFIG.court.shots.map((shot) => `
      <article class="shot-card cut-card">
        <div><div class="eyebrow">Landing Evidence</div><strong class="coordinate">${shot.coordinate}</strong><p>TRANSFER TO THE DIGITAL COURT</p></div>
      </article>`).join('');
    document.getElementById('cards').innerHTML = backs + '<div class="blank"></div><div class="blank"></div>';
  </script>
</body>
</html>
