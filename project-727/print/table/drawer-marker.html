<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 727 — Drawer Marker</title>
  <link rel="stylesheet" href="../_print.css" />
  <style>
    .marker-grid { min-height: 10.5in; display: grid; grid-template-columns: repeat(3, 1.7in); grid-auto-rows: 1.7in; gap: .3in; place-content: center; }
    .marker { display: grid; place-items: center; border: 1px dashed var(--line); background: #f8faf8; }
    .marker strong { color: var(--gold); font-size: 70px; line-height: 1; }
    .marker span { color: var(--green); font: 700 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main class="sheet">
    <i class="registration tl"></i><i class="registration tr"></i><i class="registration bl"></i><i class="registration br"></i>
    <div class="marker-grid">
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
      <div class="marker"><strong>△</strong><span>PROJECT 727</span></div>
    </div>
    <div class="print-meta">Triangle drawer markers // choose one // 100% scale</div>
  </main>
</body>
</html>
