<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 727 — Room Maps</title>
  <link rel="stylesheet" href="../_print.css" />
  <style>
    .map-sheet { padding: .55in; }
    .map-header { display: flex; justify-content: space-between; align-items: end; margin: .2in 0 .35in; }
    .map-header h1 { margin: .06in 0 0; color: var(--green); font-size: 38px; }
    .map-header p { max-width: 3.6in; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: right; }
    .physical-map { position: relative; width: 7.4in; height: 7.1in; margin: 0 auto; border: 1px solid #64786c; background: linear-gradient(rgba(18,60,43,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(18,60,43,.045) 1px, transparent 1px), #fbfcfa; background-size: .25in .25in; }
    .physical-map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .physical-map line { stroke: #365747; stroke-width: .48; }
    .physical-map line.door { stroke: #9a7736; stroke-width: .72; stroke-dasharray: 2 1.2; }
    .door-label { fill: #744f13; font: 700 2.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; paint-order: stroke; stroke: #fff; stroke-width: 1.1px; }
    .edge-direction rect { fill: #fff; opacity: .94; }
    .edge-direction text { fill: #123c2b; font: 700 4px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .map-node { position: absolute; left: var(--x); top: var(--y); width: .76in; height: .76in; transform: translate(-50%,-50%); display: grid; place-items: center; border: 2px solid var(--green); border-radius: 50%; background: #fff; color: var(--green); font: 700 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .key-label { position: absolute; left: calc(var(--x) + 2.8%); top: calc(var(--y) + 5%); transform: translate(-50%,-50%); border: 1px solid currentColor; background: #fff; padding: 5px 8px; font: 700 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .key-label.red { color: #a8342e; }
    .key-label.blue { color: #28679c; }
    .legend { display: grid; grid-template-columns: repeat(4,1fr); gap: .12in; margin: .28in auto 0; width: 7.4in; }
    .legend div { border: 1px solid #a9b5ad; padding: .12in; color: var(--muted); font: 9px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center; }
  </style>
</head>
<body>
  <div id="maps"></div>
  <script src="../../shared/game-config.js"></script>
  <script>
    const arrowDefs = `
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto"><path d="M0,0 L0,4 L4,2 z" fill="#365747"></path></marker>
        <marker id="arrow-start" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" refX=".5" refY="2" orient="auto"><path d="M4,0 L4,4 L0,2 z" fill="#365747"></path></marker>
      </defs>`;
    const sheets = Object.entries(PROJECT727_CONFIG.room.maps).map(([mapId, map]) => {
      const lines = map.edges.map((edge) => {
        const from = map.nodes.find((node) => node.id === edge.from);
        const to = map.nodes.find((node) => node.id === edge.to);
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;
        const angle = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
        return `<line class="${edge.door ? 'door' : ''}" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" marker-end="url(#arrow)" ${edge.twoWay ? 'marker-start="url(#arrow-start)"' : ''}></line>
          <g class="edge-direction" transform="translate(${mx} ${my}) rotate(${angle})"><rect x="-4" y="-2.8" width="8" height="5.6" rx="1"></rect><text x="0" y="1.35" text-anchor="middle">${edge.twoWay ? '↔' : '→'}</text></g>
          ${edge.door ? `<text class="door-label" x="${mx}" y="${my - 3.5}" text-anchor="middle">${edge.door.toUpperCase()} DOOR</text>` : ''}`;
      }).join('');
      const nodes = map.nodes.map((node) => `<div class="map-node" style="--x:${node.x}%;--y:${node.y}%">${node.id}</div>${node.item ? `<div class="key-label ${node.item}" style="--x:${node.x}%;--y:${node.y}%">${node.item.toUpperCase()} KEY</div>` : ''}`).join('');
      return `<main class="sheet map-sheet">
        <i class="registration tl"></i><i class="registration tr"></i><i class="registration bl"></i><i class="registration br"></i>
        <header class="map-header"><div><div class="eyebrow">Record 03 // Physical Route Evidence</div><h1>Map ${mapId}</h1></div><p>Reach X. Visit central room C. Obey every arrow, use matching keys, and never revisit a room.</p></header>
        <div class="physical-map"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${arrowDefs}${lines}</svg>${nodes}</div>
        <div class="legend"><div>ARROW = ONE WAY</div><div>DOUBLE ARROW = TWO WAY</div><div>DASHED = LOCKED DOOR</div><div>KEY IS COLLECTED ON ENTRY</div></div>
        <div class="print-meta">Room map ${mapId} // Letter // 100% scale</div>
      </main>`;
    }).join('');
    document.getElementById('maps').innerHTML = sheets;
  </script>
</body>
</html>
