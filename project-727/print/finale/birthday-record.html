<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 727 — Birthday Record</title>
  <link rel="stylesheet" href="../_print.css" />
  <style>
    .card-wrap { min-height: 10.5in; display: grid; place-items: center; }
    .birthday-card { width: 7in; height: 5in; display: grid; grid-template-columns: 1.1fr .9fr; gap: .35in; padding: .48in; border: 1px dashed var(--line); background: linear-gradient(145deg, #fffdf7, #f2eee3); }
    h1 { margin: .18in 0; color: var(--green); font-size: 42px; line-height: 1.05; }
    .message { color: #4f5e56; font-size: 15px; line-height: 1.6; }
    .photo-placeholder { display: grid; place-items: center; border: 1px solid #b8ae96; color: var(--muted); font: 9px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center; }
    .record-line { margin-top: .28in; color: var(--gold); font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; }
  </style>
</head>
<body>
  <main class="sheet">
    <i class="registration tl"></i><i class="registration tr"></i><i class="registration bl"></i><i class="registration br"></i>
    <div class="card-wrap">
      <article class="birthday-card">
        <div>
          <div class="eyebrow">Project 727 // Record 05</div>
          <h1>Happy Birthday, Tina.</h1>
          <p class="message">The archive is restored, and today’s record is ready to be kept—not solved.</p>
          <div class="record-line">TODAY // JULY 27</div>
        </div>
        <div class="photo-placeholder">INSERT A RECENT LOCAL PHOTO<br>OR KEEP THIS ELEGANT PLACEHOLDER</div>
      </article>
    </div>
    <div class="print-meta">Birthday record // ivory or champagne stock // 100%</div>
  </main>
</body>
</html>
