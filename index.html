<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>周末小厨 V5 (旗舰版) 🥘</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --dark: #2d3436;
            --bg: #f7f9fc;
            --white: #ffffff;
            --easy: #2ecc71;  /* 绿色-快手 */
            --norm: #f1c40f;  /* 黄色-家常 */
            --hard: #e74c3c;  /* 红色-大菜 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 100px; /* 底部留白 */
        }

        /* 标题栏 */
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; font-size: 24px; }
        .subtitle { font-size: 12px; color: #999; margin-top: 5px; }

        /* 通用按钮 */
        button { border: none; cursor: pointer; border-radius: 8px; font-weight: 600; transition: 0.1s; outline: none; }
        button:active { transform: scale(0.96); opacity: 0.9; }
        .btn-main { width: 100%; background: var(--primary); color: white; padding: 14px; font-size: 16px; box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3); }
        .btn-ghost { background: transparent; border: 1px solid #ddd; color: #666; padding: 6px 12px; font-size: 13px; border-radius: 20px; }
        .btn-icon { background: #f1f2f6; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; }
        
        /* 卡片容器 */
        .card { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 15px; }

        /* 星期选择器 */
        .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .day-opt { background: #f1f2f6; padding: 10px 0; border-radius: 8px; text-align: center; font-size: 14px; cursor: pointer; border: 2px solid transparent; user-select: none; }
        .day-opt.selected { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 5px rgba(255,107,107,0.3); }

        /* 菜单展示 */
        .menu-day { border-left: 5px solid var(--secondary); padding-left: 12px; margin-bottom: 15px; background: white; padding: 12px; border-radius: 0 12px 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .day-header { font-weight: 800; font-size: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .dish-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .dish-row:last-child { border: none; }
        
        /* 标签体系 */
        .tags-row { display: flex; gap: 4px; align-items: center; margin-right: 6px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; white-space: nowrap; }
        .b-meat { background: #ff9f43; }
        .b-veg { background: #2ecc71; }
        .b-soup { background: #54a0ff; }
        .b-out { background: #a29bfe; }
        
        /* 难度圆点 */
        .diff-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .d-easy { background: var(--easy); }
        .d-norm { background: var(--norm); }
        .d-hard { background: var(--hard); }

        /* 底部导航 */
        .bottom-bar { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .bottom-bar button { flex: 1; white-space: nowrap; }

        /* 弹窗通用 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-body { background: white; width: 85%; max-width: 400px; padding: 20px; border-radius: 16px; max-height: 80vh; overflow-y: auto; animation: popUp 0.2s ease-out; display: flex; flex-direction: column; }
        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .modal-close { cursor: pointer; color: #999; }
        
        /* 操作菜单列表 */
        .action-list button { width: 100%; text-align: left; padding: 12px; background: #f8f9fa; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .action-list button:hover { background: #e9ecef; }
        
        /* 选菜列表 */
        .select-list { margin-top: 10px; }
        .select-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .select-item:active { background: #f0f0f0; }

        /* 输入框 */
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        /* 专注模式 */
        #focusMode { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .focus-card { border: 2px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <header>
        <h1>🥘 周末小厨 V5</h1>
        <div class="subtitle">智能生成 | 手动精选 | 难度分级</div>
    </header>

    <!-- 1. 选日期 -->
    <div class="card">
        <div style="font-weight:bold; margin-bottom:8px;">📅 选择做饭日期</div>
        <div class="days-grid" id="daysGrid"></div>
        <div style="margin-top:15px; display:flex; align-items:center;">
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; color:#555;">
                <input type="checkbox" id="optSoup" style="width:auto; margin:0;"> 🍲 每餐配汤
            </label>
        </div>
    </div>

    <button class="btn-main" onclick="generateMenu()">🎲 生成完美菜单</button>

    <!-- 2. 菜单列表 -->
    <div id="resultArea" style="margin-top: 20px;">
        <div style="text-align:center; color:#ccc; padding:30px;">
            👇 点击按钮，开始规划下周美食
        </div>
    </div>

    <!-- 3. 购物清单 (自动显示) -->
    <div class="card" id="shopCard" style="display:none; background:#fff8e1;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0; color:#d35400;">🛒 采购清单</h3>
            <button class="btn-ghost" onclick="copyShop()">📋 复制</button>
        </div>
        <div id="shopList" style="column-count:2; font-size:14px; line-height:1.8;"></div>
    </div>

    <!-- 4. 底部功能 -->
    <div class="bottom-bar">
        <button class="btn-ghost" onclick="openFocusMode()">👨‍🍳 专注烹饪</button>
        <button class="btn-ghost" onclick="openManager()">📚 菜谱库</button>
        <button class="btn-ghost" onclick="openSync()">☁️ 同步</button>
        <button class="btn-ghost" style="color:#ff6b6b;" onclick="clearAll()">🗑️ 清空</button>
    </div>

    <!-- === 弹窗：单菜操作菜单 === -->
    <div id="modalAction" class="modal">
        <div class="modal-body">
            <div class="modal-header">
                <span>🍽️ 调整这道菜</span>
                <span class="modal-close" onclick="closeModal('modalAction')">✕</span>
            </div>
            <div class="action-list">
                <button onclick="doReroll()">
                    <span>🎲</span> 随机换一道 (同类)
                </button>
                <button onclick="openManualSelect()">
                    <span>👆</span> 手动选择 (从菜谱库)
                </button>
                <button onclick="doSetTakeout()">
                    <span>🛵</span> 改为外卖/出去吃
                </button>
                <button onclick="openEditorFromMenu()">
                    <span>🖊️</span> 编辑这道菜 (链接/难度)
                </button>
            </div>
        </div>
    </div>

    <!-- === 弹窗：手动选菜 === -->
    <div id="modalSelect" class="modal">
        <div class="modal-body" style="height:70vh;">
            <div class="modal-header">
                <span>👆 选择菜品</span>
                <span class="modal-close" onclick="closeModal('modalSelect')">✕</span>
            </div>
            <input type="text" id="selectSearch" placeholder="🔍 搜索菜名..." oninput="renderSelectableList()">
            <div class="select-list" id="selectableList"></div>
        </div>
    </div>

    <!-- === 弹窗：菜谱库管理 === -->
    <div id="modalManager" class="modal">
        <div class="modal-body" style="height:70vh;">
            <div class="modal-header">
                <span>📚 菜谱库</span>
                <span class="modal-close" onclick="closeModal('modalManager')">✕</span>
            </div>
            <div style="display:flex; gap:10px;">
                <input id="mgrSearch" placeholder="🔍 搜索..." oninput="renderManagerList()" style="margin-bottom:10px;">
                <button class="btn-main" style="width:auto; padding:0 15px; height:46px; margin-top:5px;" onclick="openEditor()">➕</button>
            </div>
            <div id="managerList" class="select-list"></div>
        </div>
    </div>

    <!-- === 弹窗：编辑/添加 === -->
    <div id="modalEditor" class="modal">
        <div class="modal-body">
            <div class="modal-header">
                <span id="editorTitle">📝 编辑菜谱</span>
                <span class="modal-close" onclick="closeModal('modalEditor')">✕</span>
            </div>
            <input type="hidden" id="editIdx">
            <label>菜名</label><input id="eName" placeholder="例如：红烧排骨">
            <label>类型</label>
            <select id="eType">
                <option value="meat">🍖 荤菜</option>
                <option value="veg">🥬 素菜</option>
                <option value="soup">🍲 汤/羹</option>
            </select>
            <label>难度/耗时</label>
            <select id="eDiff">
                <option value="easy">⚡ 快手 (15分钟内)</option>
                <option value="norm" selected>🍳 家常 (30分钟左右)</option>
                <option value="hard">🔥 大菜 (耗时/复杂)</option>
            </select>
            <label>食材 (空格分隔)</label><input id="eIng" placeholder="排骨 姜 冰糖">
            <label>做法链接 (小红书/下厨房)</label><input id="eLink" placeholder="http://...">
            <button class="btn-main" onclick="saveDish()">保存</button>
        </div>
    </div>

    <!-- === 专注模式界面 === -->
    <div id="focusMode">
        <div style="max-width:600px; margin:0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="margin:0;">👨‍🍳 正在烹饪</h2>
                <button class="btn-ghost" onclick="document.getElementById('focusMode').style.display='none'">✕ 退出</button>
            </div>
            <div id="focusContent"></div>
        </div>
    </div>

<script>
    // --- V5.0 数据升级：增加了 diff (难度) 字段 ---
    const defaultDB = [
        // 🍖 荤菜
        {name:"辣椒炒肉", type:"meat", diff:"norm", ing:"五花肉 青椒 蒜", link:""},
        {name:"红烧排骨", type:"meat", diff:"hard", ing:"排骨 姜 冰糖", link:""},
        {name:"可乐鸡翅", type:"meat", diff:"norm", ing:"鸡翅中 可乐 姜", link:""},
        {name:"宫保鸡丁", type:"meat", diff:"norm", ing:"鸡胸肉 花生 黄瓜", link:""},
        {name:"清蒸鲈鱼", type:"meat", diff:"easy", ing:"鲈鱼 葱 姜", link:""},
        {name:"土豆炖牛腩", type:"meat", diff:"hard", ing:"牛腩 土豆 洋葱", link:""},
        {name:"鱼香肉丝", type:"meat", diff:"hard", ing:"里脊肉 木耳 胡萝卜", link:""},
        {name:"蒜苔炒肉", type:"meat", diff:"easy", ing:"瘦肉 蒜苔", link:""},
        {name:"黄焖鸡", type:"meat", diff:"hard", ing:"鸡腿肉 青椒 香菇", link:""},
        {name:"油焖大虾", type:"meat", diff:"easy", ing:"虾 姜 葱", link:""},
        
        // 🥬 素菜
        {name:"酸辣土豆丝", type:"veg", diff:"norm", ing:"土豆 干辣椒 醋", link:""},
        {name:"西红柿炒蛋", type:"veg", diff:"easy", ing:"西红柿 鸡蛋 葱", link:""},
        {name:"蒜蓉油麦菜", type:"veg", diff:"easy", ing:"油麦菜 蒜", link:""},
        {name:"手撕包菜", type:"veg", diff:"easy", ing:"包菜 干辣椒 蒜", link:""},
        {name:"地三鲜", type:"veg", diff:"norm", ing:"土豆 茄子 青椒", link:""},
        {name:"麻婆豆腐", type:"veg", diff:"norm", ing:"豆腐 肉末 豆瓣酱", link:""},
        {name:"凉拌黄瓜", type:"veg", diff:"easy", ing:"黄瓜 蒜 醋", link:""},
        {name:"韭菜炒鸡蛋", type:"veg", diff:"easy", ing:"韭菜 鸡蛋", link:""},
        
        // 🍲 汤
        {name:"紫菜蛋花汤", type:"soup", diff:"easy", ing:"紫菜 鸡蛋", link:""},
        {name:"冬瓜排骨汤", type:"soup", diff:"hard", ing:"排骨 冬瓜 姜", link:""},
        {name:"番茄蛋汤", type:"soup", diff:"easy", ing:"西红柿 鸡蛋", link:""},
        {name:"菌菇豆腐汤", type:"soup", diff:"easy", ing:"金针菇 豆腐", link:""}
    ];

    // 全局状态
    let recipes = JSON.parse(localStorage.getItem('myRecipes_v5')) || defaultDB;
    // 兼容性检查：如果旧数据没有diff字段，默认给norm
    recipes.forEach(r => { if(!r.diff) r.diff = 'norm'; });
    
    let currentMenu = JSON.parse(localStorage.getItem('currentMenu_v5')) || [];
    let selectedDays = [];
    const weekDays = ["周一","周二","周三","周四","周五","周六","周日"];

    // 临时存储当前操作的菜
    let activeDayIdx = -1;
    let activeDishIdx = -1;

    // --- 初始化 ---
    function init() {
        const grid = document.getElementById('daysGrid');
        weekDays.forEach(day => {
            let d = document.createElement('div');
            d.className = 'day-opt';
            d.innerText = day;
            d.onclick = () => {
                if(selectedDays.includes(day)) {
                    selectedDays = selectedDays.filter(x=>x!==day);
                    d.classList.remove('selected');
                } else {
                    selectedDays.push(day);
                    d.classList.add('selected');
                }
            };
            grid.appendChild(d);
        });

        if(currentMenu.length > 0) renderMenu();
    }
    init();

    // --- 1. 生成菜单 ---
    function generateMenu() {
        if(selectedDays.length === 0) return alert("请先选择日期");
        const needSoup = document.getElementById('optSoup').checked;
        
        // 创建随机池
        let pool = {
            meat: recipes.filter(r=>r.type==='meat').sort(()=>Math.random()-0.5),
            veg: recipes.filter(r=>r.type==='veg').sort(()=>Math.random()-0.5),
            soup: recipes.filter(r=>r.type==='soup').sort(()=>Math.random()-0.5)
        };

        let newMenu = [];
        selectedDays.forEach(day => {
            let dishes = [];
            
            // 辅助取菜函数
            const pick = (type) => {
                if(pool[type].length === 0) {
                    // 池子空了重新洗牌（允许重复）
                    pool[type] = recipes.filter(r=>r.type===type).sort(()=>Math.random()-0.5);
                }
                return pool[type].length ? pool[type].pop() : null;
            };

            let meat = pick('meat'); if(meat) dishes.push(meat);
            let veg = pick('veg'); if(veg) dishes.push(veg);
            if(needSoup) { let soup = pick('soup'); if(soup) dishes.push(soup); }

            newMenu.push({ day: day, dishes: dishes });
        });

        currentMenu = newMenu;
        saveAndRender();
    }

    // --- 2. 渲染主界面 ---
    function renderMenu() {
        const area = document.getElementById('resultArea');
        area.innerHTML = "";
        let allIng = {};

        if(currentMenu.length === 0) {
            area.innerHTML = '<div style="text-align:center;color:#bbb;padding:40px;">暂无菜单</div>';
            document.getElementById('shopCard').style.display = 'none';
            return;
        }

        currentMenu.forEach((item, dayIdx) => {
            let html = `<div class="menu-day"><div class="day-header">${item.day}</div>`;
            
            item.dishes.forEach((dish, dishIdx) => {
                // 收集食材
                if(dish.ing && dish.name !== "外卖") {
                    dish.ing.split(" ").forEach(k => { if(k) allIng[k] = (allIng[k]||0)+1; });
                }

                // 样式处理
                let isOut = dish.name === "外卖";
                let typeBadge = '';
                if(isOut) typeBadge = `<span class="badge b-out">外卖</span>`;
                else if(dish.type === 'meat') typeBadge = `<span class="badge b-meat">荤</span>`;
                else if(dish.type === 'veg') typeBadge = `<span class="badge b-veg">素</span>`;
                else typeBadge = `<span class="badge b-soup">汤</span>`;

                // 难度点
                let diffDot = '';
                if(!isOut && dish.diff) diffDot = `<span class="diff-dot d-${dish.diff}"></span>`;
                
                // 链接
                let linkBtn = (!isOut && dish.link) ? `<a href="${dish.link}" target="_blank" style="text-decoration:none; margin-left:5px;">🔗</a>` : '';

                html += `
                    <div class="dish-row">
                        <div style="flex:1; display:flex; align-items:center;">
                            <div class="tags-row">${typeBadge}</div>
                            ${diffDot}
                            <span style="font-weight:500; ${isOut?'color:#999':''}">${dish.name}</span>
                            ${linkBtn}
                        </div>
                        <button class="btn-icon" onclick="openAction(${dayIdx}, ${dishIdx})">⚙️</button>
                    </div>
                `;
            });
            html += `</div>`;
            area.innerHTML += html;
        });

        // 渲染购物清单
        const sList = document.getElementById('shopList');
        sList.innerHTML = "";
        if(Object.keys(allIng).length > 0) {
            document.getElementById('shopCard').style.display = 'block';
            for(let k in allIng) {
                sList.innerHTML += `<div>▫️ ${k} ${allIng[k]>1 ? '<small style="color:#aaa">x'+allIng[k]+'</small>':''}</div>`;
            }
        } else {
            document.getElementById('shopCard').style.display = 'none';
        }
    }

    function saveAndRender() {
        localStorage.setItem('currentMenu_v5', JSON.stringify(currentMenu));
        renderMenu();
    }

    // --- 3. 交互逻辑 ---

    // 打开操作菜单
    function openAction(dayIdx, dishIdx) {
        activeDayIdx = dayIdx;
        activeDishIdx = dishIdx;
        document.getElementById('modalAction').style.display = 'flex';
    }

    // 动作A: 随机换
    function doReroll() {
        let currentDish = currentMenu[activeDayIdx].dishes[activeDishIdx];
        let type = currentDish.type || 'meat'; // 默认为荤，防止外卖换回来报错
        
        // 找同类候选
        let candidates = recipes.filter(r => r.type === type && r.name !== currentDish.name);
        if(candidates.length === 0) candidates = recipes.filter(r => r.type === type); // 实在没有就允许自己
        
        let newDish = candidates[Math.floor(Math.random() * candidates.length)];
        currentMenu[activeDayIdx].dishes[activeDishIdx] = newDish;
        
        saveAndRender();
        closeModal('modalAction');
    }

    // 动作B: 设为外卖
    function doSetTakeout() {
        currentMenu[activeDayIdx].dishes[activeDishIdx] = { name: "外卖", type: "out", ing: "" };
        saveAndRender();
        closeModal('modalAction');
    }

    // 动作C: 手动选择 - 打开列表
    function openManualSelect() {
        closeModal('modalAction');
        document.getElementById('modalSelect').style.display = 'flex';
        renderSelectableList();
    }

    // 渲染可选列表
    function renderSelectableList() {
        const list = document.getElementById('selectableList');
        const search = document.getElementById('selectSearch').value.toLowerCase();
        list.innerHTML = "";
        
        // 过滤
        let matched = recipes.filter(r => r.name.toLowerCase().includes(search));
        
        matched.forEach(r => {
            let div = document.createElement('div');
            div.className = 'select-item';
            // 显示难度颜色
            let diffColor = r.diff=='easy'?'var(--easy)' : (r.diff=='hard'?'var(--hard)':'var(--norm)');
            
            div.innerHTML = `
                <div>
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${diffColor};margin-right:5px;"></span>
                    <b>${r.name}</b> <span style="font-size:12px;color:#888;">${r.ing}</span>
                </div>
                <div class="badge b-${r.type}">${r.type=='meat'?'荤':(r.type=='veg'?'素':'汤')}</div>
            `;
            div.onclick = () => {
                currentMenu[activeDayIdx].dishes[activeDishIdx] = r;
                saveAndRender();
                closeModal('modalSelect');
            };
            list.appendChild(div);
        });
    }

    // 动作D: 编辑当前这道菜
    function openEditorFromMenu() {
        closeModal('modalAction');
        let currentDish = currentMenu[activeDayIdx].dishes[activeDishIdx];
        if(currentDish.name === "外卖") return alert("外卖不能编辑");
        
        // 找到它在库里的索引
        let idx = recipes.findIndex(r => r.name === currentDish.name);
        openEditor(idx);
    }

    // --- 4. 菜谱库管理 & 编辑器 ---
    function openManager() {
        document.getElementById('modalManager').style.display = 'flex';
        renderManagerList();
    }

    function renderManagerList() {
        const list = document.getElementById('managerList');
        const search = document.getElementById('mgrSearch').value.toLowerCase();
        list.innerHTML = "";
        
        recipes.forEach((r, idx) => {
            if(r.name.includes(search)) {
                let div = document.createElement('div');
                div.className = 'select-item';
                div.innerHTML = `
                    <div><b>${r.name}</b> <small style="color:#aaa">${r.type}</small></div>
                    <button class="btn-ghost" onclick="openEditor(${idx})">🖊️</button>
                `;
                list.appendChild(div);
            }
        });
    }

    function openEditor(idx = -1) {
        document.getElementById('modalManager').style.display = 'none'; // 暂时隐藏上级
        document.getElementById('modalEditor').style.display = 'flex';
        document.getElementById('editIdx').value = idx;
        
        if(idx >= 0) {
            let r = recipes[idx];
            document.getElementById('eName').value = r.name;
            document.getElementById('eType').value = r.type;
            document.getElementById('eDiff').value = r.diff || 'norm';
            document.getElementById('eIng').value = r.ing;
            document.getElementById('eLink').value = r.link || "";
        } else {
            document.getElementById('eName').value = "";
            document.getElementById('eIng').value = "";
            document.getElementById('eLink').value = "";
        }
    }

    function saveDish() {
        let idx = parseInt(document.getElementById('editIdx').value);
        let newDish = {
            name: document.getElementById('eName').value,
            type: document.getElementById('eType').value,
            diff: document.getElementById('eDiff').value,
            ing: document.getElementById('eIng').value,
            link: document.getElementById('eLink').value
        };
        
        if(!newDish.name) return alert("菜名必填");

        if(idx >= 0) {
            recipes[idx] = newDish;
            // 如果菜单里有这道菜，也顺便更新一下显示
            currentMenu.forEach(day => {
                day.dishes.forEach((d, i) => { if(d.name === recipes[idx].name) day.dishes[i] = newDish; });
            });
        } else {
            recipes.push(newDish);
        }
        
        localStorage.setItem('myRecipes_v5', JSON.stringify(recipes));
        saveAndRender();
        closeModal('modalEditor');
    }

    // --- 5. 专注模式 ---
    function openFocusMode() {
        if(currentMenu.length === 0) return alert("先生成菜单！");
        const panel = document.getElementById('focusMode');
        const content = document.getElementById('focusContent');
        panel.style.display = 'block';
        content.innerHTML = "";

        currentMenu.forEach(item => {
            if(item.dishes.length === 0) return;
            let html = `<div class="focus-card">
                <h3 style="margin-top:0; color:#ff6b6b; font-size:24px;">${item.day}</h3>`;
            
            item.dishes.forEach(d => {
                if(d.name === "外卖") {
                    html += `<div style="padding:10px; background:#f0f0f0; border-radius:8px; margin-bottom:10px;">🛵 点外卖</div>`;
                } else {
                    let link = d.link ? `<a href="${d.link}" target="_blank" style="display:block; margin-top:5px; color:#0984e3;">📺哪怕看一眼教程</a>` : '';
                    html += `
                        <div style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                            <div style="font-size:20px; font-weight:bold;">${d.name}</div>
                            <div style="color:#666; margin-top:5px;">食材: ${d.ing}</div>
                            ${link}
                        </div>
                    `;
                }
            });
            html += `</div>`;
            content.innerHTML += html;
        });
    }

    // --- 通用工具 ---
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function clearAll() {
        if(confirm("确定清空菜单吗？")) {
            currentMenu = [];
            selectedDays = [];
            document.querySelectorAll('.day-opt').forEach(d => d.classList.remove('selected'));
            saveAndRender();
        }
    }
    function copyShop() {
        let text = document.getElementById('shopList').innerText;
        let area = document.createElement('textarea');
        area.value = "🛒 采购清单：\n" + text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        alert("已复制");
    }
</script>
</body>
</html>
