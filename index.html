<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>周末小厨 V6.1 (海量菜谱版) 🥘</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --bg: #f7f9fc;
            --white: #ffffff;
            --text-main: #2d3436;
            
            /* 分类颜色 */
            --c-meat: #ff9f43;
            --c-veg: #2ecc71;
            --c-soup: #54a0ff;
            --c-staple: #a29bfe;
            --c-out: #b2bec3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 90px;
        }

        h1 { text-align: center; color: var(--primary); font-size: 22px; margin: 10px 0; }
        .subtitle { text-align: center; font-size: 12px; color: #999; margin-bottom: 20px; }

        button { border: none; cursor: pointer; border-radius: 8px; font-weight: 600; transition: 0.1s; outline: none; }
        button:active { transform: scale(0.96); opacity: 0.9; }
        
        .btn-main { width: 100%; background: var(--primary); color: white; padding: 12px; font-size: 16px; box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3); }
        .btn-ghost { background: transparent; color: #666; padding: 5px 10px; font-size: 12px; }
        .btn-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f1f2f6; color: #666; font-size: 14px; }
        .btn-del { background: #ffeaa7; color: #d63031; }

        .card { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 12px; }

        .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .day-opt { background: #dfe4ea; padding: 8px 0; border-radius: 6px; text-align: center; font-size: 13px; color: #666; cursor: pointer; border: 2px solid transparent; }
        .day-opt.selected { background: var(--primary); color: white; border-color: var(--primary); }

        .menu-day { border-left: 5px solid var(--secondary); background: white; margin-bottom: 15px; border-radius: 8px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .day-header { font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
        .dish-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #f1f2f6; }
        .dish-row:last-child { border: none; }

        .badge { font-size: 10px; padding: 2px 5px; border-radius: 4px; color: white; margin-right: 6px; display: inline-block; min-width: 24px; text-align: center;}
        .b-meat { background: var(--c-meat); }
        .b-veg { background: var(--c-veg); }
        .b-soup { background: var(--c-soup); }
        .b-staple { background: var(--c-staple); }
        .b-out { background: var(--c-out); }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; z-index: 900; }
        .bottom-btn { background: none; color: #666; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 420px; height: 80vh; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; position: relative; animation: slideUp 0.2s ease-out; box-sizing: border-box; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        
        .filter-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .filter-btn { padding: 6px 12px; border-radius: 20px; background: #f1f2f6; font-size: 12px; white-space: nowrap; color: #666; }
        .filter-btn.active { background: var(--text-main); color: white; }
        
        .mgr-list { flex: 1; overflow-y: auto; }
        .mgr-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f6fa; }
        
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #dfe4ea; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fdfdfd; }
        label { font-size: 12px; color: #999; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🥘 周末小厨 V6.1</h1>
    <div class="subtitle">海量预设 / 智能去重 / 购物清单</div>

    <div class="card">
        <div style="font-weight:bold; margin-bottom:5px;">📅 哪天做饭？</div>
        <div class="days-grid" id="daysGrid"></div>
        <div style="margin-top:15px; display:flex; gap:15px; font-size:13px; color:#555;">
            <label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" id="optSoup"> 配汤</label>
            <label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" id="optStaple" checked> 配主食</label>
        </div>
    </div>

    <button class="btn-main" onclick="generateMenu()">🎲 生成下周菜单</button>

    <div id="resultArea" style="margin-top: 20px; padding-bottom: 50px;">
        <div style="text-align:center; color:#ccc; padding:40px;">还没生成菜单</div>
    </div>

    <div class="card" id="shopCard" style="display:none; background:#fff8e1;">
        <div style="display:flex; justify-content:space-between;">
            <h3 style="margin:0; color:#d35400;">🛒 采购清单</h3>
            <button class="btn-ghost" onclick="copyShop()">📋 复制</button>
        </div>
        <div id="shopList" style="column-count:2; font-size:13px; margin-top:10px;"></div>
    </div>

    <div class="bottom-bar">
        <button class="bottom-btn" onclick="openManager('all')"><span>📚</span> 菜谱库</button>
        <button class="bottom-btn" onclick="openFocusMode()"><span>👨‍🍳</span> 专注模式</button>
        <button class="bottom-btn" onclick="openSync()"><span>☁️</span> 同步</button>
        <button class="bottom-btn" onclick="clearAll()" style="color:#ff6b6b;"><span>🗑️</span> 重置</button>
    </div>

    <!-- 弹窗组件保持 V6 架构 -->
    <div id="modalManager" class="modal">
        <div class="modal-body">
            <div class="modal-header"><span>📚 菜谱管理</span><span onclick="closeModal('modalManager')" style="cursor:pointer;font-size:24px;">×</span></div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input id="mgrSearch" placeholder="🔍 搜菜名" oninput="renderManagerList()" style="margin:0;">
                <button class="btn-main" style="width:auto; padding:0 15px; margin:0;" onclick="openEditor(-1, 'manager')">➕</button>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                <button class="filter-btn" onclick="setFilter('meat', this)">🍖 荤菜</button>
                <button class="filter-btn" onclick="setFilter('veg', this)">🥬 素菜</button>
                <button class="filter-btn" onclick="setFilter('staple', this)">🍚 主食</button>
                <button class="filter-btn" onclick="setFilter('soup', this)">🍲 汤</button>
            </div>
            <div id="mgrList" class="mgr-list"></div>
        </div>
    </div>

    <div id="modalEditor" class="modal">
        <div class="modal-body" style="height:auto; max-height:85vh;">
            <div class="modal-header"><span id="editorTitle">编辑菜谱</span><span onclick="cancelEdit()" style="cursor:pointer;font-size:24px;">×</span></div>
            <input type="hidden" id="editIdx"><input type="hidden" id="editSource">
            <label>菜名</label><input id="eName">
            <label>类型</label><select id="eType"><option value="meat">🍖 荤菜</option><option value="veg">🥬 素菜</option><option value="staple">🍚 主食</option><option value="soup">🍲 汤</option></select>
            <label>难度</label><select id="eDiff"><option value="easy">⚡ 快手</option><option value="norm">🍳 家常</option><option value="hard">🔥 耗时/大菜</option></select>
            <label>食材 (空格分隔)</label><input id="eIng" placeholder="排骨 姜">
            <label>链接</label><input id="eLink">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-main" onclick="saveDish()">💾 保存</button>
                <button class="btn-ghost" style="border:1px solid #ddd; border-radius:8px;" onclick="cancelEdit()">取消</button>
            </div>
        </div>
    </div>

    <div id="modalAction" class="modal">
        <div class="modal-body" style="height:auto;">
            <div class="modal-header"><span>🍽️ 调整这道菜</span><span onclick="closeModal('modalAction')" style="cursor:pointer;">×</span></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-ghost" style="text-align:left; padding:15px; background:#f8f9fa;" onclick="doReroll()">🎲 随机换一道</button>
                <button class="btn-ghost" style="text-align:left; padding:15px; background:#f8f9fa;" onclick="openManualSelect()">👆 手动选择</button>
                <button class="btn-ghost" style="text-align:left; padding:15px; background:#f8f9fa;" onclick="doSetTakeout()">🛵 改为外卖</button>
                <button class="btn-ghost" style="text-align:left; padding:15px; background:#f8f9fa;" onclick="openEditorFromMenu()">🖊️ 编辑这道菜</button>
            </div>
        </div>
    </div>

    <div id="modalSelect" class="modal">
        <div class="modal-body">
            <div class="modal-header"><span>👆 选择菜品</span><span onclick="closeModal('modalSelect')" style="cursor:pointer;">×</span></div>
            <input id="selSearch" placeholder="🔍 搜索..." oninput="renderSelectList()">
            <div id="selList" class="mgr-list"></div>
        </div>
    </div>

    <div id="modalSync" class="modal">
        <div class="modal-body" style="height:auto;">
            <div class="modal-header"><span>☁️ 同步数据</span><span onclick="closeModal('modalSync')" style="cursor:pointer;">×</span></div>
            <textarea id="syncData" rows="5" style="width:100%; border:1px solid #eee;"></textarea>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-ghost" style="border:1px solid #eee; flex:1;" onclick="doExport()">📤 复制导出</button>
                <button class="btn-main" style="flex:1;" onclick="doImport()">📥 确认导入</button>
            </div>
        </div>
    </div>

    <div id="focusMode" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; overflow-y:auto; padding:20px; box-sizing:border-box;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0;">👨‍🍳 烹饪模式</h2><button onclick="document.getElementById('focusMode').style.display='none'" style="font-size:20px;">×</button>
        </div>
        <div id="focusContent"></div>
    </div>

<script>
    // --- V6.1 旗舰级海量预设库 ---
    const megaDB = [
        // === 🍖 荤菜 (35道) ===

        {name:"红烧带鱼", type:"meat", diff:"hard", ing:"带鱼 葱 姜 蒜"},

        // === 🍚 主食 (12道) ===

        {name:"西红柿蛋汤", type:"soup", diff:"easy", ing:"西红柿 鸡蛋"},
        {name:"冬瓜排骨汤", type:"soup", diff:"hard", ing:"冬瓜 排骨 姜"},
        {name:"玉米排骨汤", type:"soup", diff:"hard", ing:"玉米 排骨 胡萝卜"},
        {name:"鲫鱼豆腐汤", type:"soup", diff:"hard", ing:"鲫鱼 豆腐 姜 葱"},
        {name:"菌菇豆腐汤", type:"soup", diff:"easy", ing:"金针菇 豆腐 鸡蛋"},
        {name:"白菜豆腐汤", type:"soup", diff:"easy", ing:"白菜 豆腐"},
        {name:"罗宋汤", type:"soup", diff:"hard", ing:"牛肉 西红柿 洋葱 土豆"},
        {name:"酸辣汤", type:"soup", diff:"norm", ing:"木耳 豆腐 鸡蛋 醋 胡椒粉"},
        {name:"莲藕排骨汤", type:"soup", diff:"hard", ing:"莲藕 排骨 姜"}
    ];

    // --- 强制更新逻辑：使用 v6_plus 作为新Key，确保覆盖旧数据 ---
    let recipes = JSON.parse(localStorage.getItem('myRecipes_v6_plus')) || megaDB;
    // 双重保险：如果读取到的数据少于20条（说明可能是旧缓存残余），强制覆盖
    if(recipes.length < 20) {
        recipes = megaDB;
        localStorage.setItem('myRecipes_v6_plus', JSON.stringify(recipes));
    }

    let currentMenu = JSON.parse(localStorage.getItem('currentMenu_v6_plus')) || [];
    let selectedDays = [];
    const weekDays = ["周一","周二","周三","周四","周五","周六","周日"];
    let activeDayIdx = -1;
    let activeDishIdx = -1;
    let currentFilter = 'all';

    function init() {
        const grid = document.getElementById('daysGrid');
        weekDays.forEach(day => {
            let d = document.createElement('div');
            d.className = 'day-opt';
            d.innerText = day;
            d.onclick = () => {
                if(selectedDays.includes(day)) {
                    selectedDays = selectedDays.filter(x=>x!==day);
                    d.classList.remove('selected');
                } else {
                    selectedDays.push(day);
                    d.classList.add('selected');
                }
            };
            grid.appendChild(d);
        });
        if(currentMenu.length) renderMenu();
    }
    init();

    // --- 核心逻辑 (保持 V6 架构) ---
    function generateMenu() {
        if(!selectedDays.length) return alert("请先选日子");
        const needSoup = document.getElementById('optSoup').checked;
        const needStaple = document.getElementById('optStaple').checked;

        // 深拷贝并打乱
        let pool = {
            meat: recipes.filter(r=>r.type==='meat').sort(()=>Math.random()-0.5),
            veg: recipes.filter(r=>r.type==='veg').sort(()=>Math.random()-0.5),
            staple: recipes.filter(r=>r.type==='staple').sort(()=>Math.random()-0.5),
            soup: recipes.filter(r=>r.type==='soup').sort(()=>Math.random()-0.5)
        };

        const pick = (type) => {
            if(!pool[type].length) pool[type] = recipes.filter(r=>r.type===type).sort(()=>Math.random()-0.5);
            return pool[type].length ? pool[type].pop() : null;
        };

        let newMenu = [];
        selectedDays.forEach(day => {
            let dishes = [];
            let m = pick('meat'); if(m) dishes.push(m);
            let v = pick('veg'); if(v) dishes.push(v);
            if(needStaple) { let s = pick('staple'); if(s) dishes.push(s); }
            if(needSoup) { let so = pick('soup'); if(so) dishes.push(so); }
            newMenu.push({ day: day, dishes: dishes });
        });

        currentMenu = newMenu;
        saveAndRender();
    }

    function renderMenu() {
        const area = document.getElementById('resultArea');
        area.innerHTML = "";
        let allIng = {};
        
        if(!currentMenu.length) return;

        currentMenu.forEach((item, dIdx) => {
            let html = `<div class="menu-day"><div class="day-header">${item.day}</div>`;
            item.dishes.forEach((dish, dishIdx) => {
                if(dish.ing && dish.name!=='外卖' && dish.name!=='米饭') {
                    dish.ing.split(" ").forEach(k=>{ if(k) allIng[k] = (allIng[k]||0)+1; });
                }
                let isOut = dish.name==='外卖';
                let tagClass = isOut?'b-out':`b-${dish.type}`;
                let tagName = isOut?'外':(dish.type==='meat'?'荤':(dish.type==='veg'?'素':(dish.type==='staple'?'主':'汤')));
                let linkHtml = dish.link ? `<a href="${dish.link}" target="_blank" style="text-decoration:none">🔗</a>` : '';

                html += `
                    <div class="dish-row">
                        <div style="flex:1;">
                            <span class="badge ${tagClass}">${tagName}</span>
                            <b>${dish.name}</b>
                            ${linkHtml}
                        </div>
                        <button class="btn-icon" onclick="openAction(${dIdx}, ${dishIdx})">⚙️</button>
                    </div>
                `;
            });
            html += `</div>`;
            area.innerHTML += html;
        });
        
        const sList = document.getElementById('shopList');
        sList.innerHTML = "";
        if(Object.keys(allIng).length) {
            document.getElementById('shopCard').style.display = 'block';
            for(let k in allIng) sList.innerHTML += `<div>▫️ ${k} x${allIng[k]}</div>`;
        } else {
            document.getElementById('shopCard').style.display = 'none';
        }
    }

    function saveAndRender() {
        localStorage.setItem('currentMenu_v6_plus', JSON.stringify(currentMenu));
        renderMenu();
    }

    // --- 管理器逻辑 ---
    function openManager(filter) {
        document.getElementById('modalManager').style.display = 'flex';
        setFilter(filter || 'all');
    }
    function setFilter(type, btn) {
        currentFilter = type;
        if(btn) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        renderManagerList();
    }
    function renderManagerList() {
        const list = document.getElementById('mgrList');
        const search = document.getElementById('mgrSearch').value.toLowerCase();
        list.innerHTML = "";
        let result = recipes.filter(r => {
            let matchType = (currentFilter === 'all') || (r.type === currentFilter);
            let matchText = r.name.includes(search) || (r.ing && r.ing.includes(search));
            return matchType && matchText;
        });
        result.forEach((r, idx) => {
            let realIdx = recipes.indexOf(r);
            let tagClass = `b-${r.type}`;
            let tagName = r.type==='meat'?'荤':(r.type==='veg'?'素':(r.type==='staple'?'主':'汤'));
            let div = document.createElement('div');
            div.className = 'mgr-item';
            div.innerHTML = `
                <div style="flex:1;" onclick="openEditor(${realIdx}, 'manager')">
                    <span class="badge ${tagClass}">${tagName}</span>
                    <span style="font-weight:bold;">${r.name}</span>
                    <div style="font-size:12px; color:#999; margin-top:4px;">${r.ing||'无食材'}</div>
                </div>
                <button class="btn-icon btn-del" onclick="deleteDish(${realIdx})">🗑️</button>
            `;
            list.appendChild(div);
        });
    }
    function deleteDish(realIdx) {
        if(confirm(`确定删除【${recipes[realIdx].name}】吗？`)) {
            recipes.splice(realIdx, 1);
            localStorage.setItem('myRecipes_v6_plus', JSON.stringify(recipes));
            renderManagerList();
        }
    }

    // --- 编辑器 ---
    function openEditor(idx, source) {
        document.getElementById('modalManager').style.display = 'none';
        document.getElementById('modalAction').style.display = 'none';
        document.getElementById('modalEditor').style.display = 'flex';
        document.getElementById('editSource').value = source;
        document.getElementById('editIdx').value = idx;
        if(idx >= 0) {
            let r = recipes[idx];
            document.getElementById('editorTitle').innerText = "编辑菜谱";
            document.getElementById('eName').value = r.name;
            document.getElementById('eType').value = r.type;
            document.getElementById('eDiff').value = r.diff;
            document.getElementById('eIng').value = r.ing;
            document.getElementById('eLink').value = r.link || "";
        } else {
            document.getElementById('editorTitle').innerText = "添加新菜";
            document.getElementById('eName').value = "";
            document.getElementById('eIng').value = "";
            document.getElementById('eLink').value = "";
        }
    }
    function cancelEdit() {
        document.getElementById('modalEditor').style.display = 'none';
        if(document.getElementById('editSource').value === 'manager') document.getElementById('modalManager').style.display = 'flex';
    }
    function saveDish() {
        let idx = parseInt(document.getElementById('editIdx').value);
        let newDish = {
            name: document.getElementById('eName').value,
            type: document.getElementById('eType').value,
            diff: document.getElementById('eDiff').value,
            ing: document.getElementById('eIng').value,
            link: document.getElementById('eLink').value
        };
        if(!newDish.name) return alert("菜名不能为空");
        if(idx >= 0) {
            recipes[idx] = newDish;
            currentMenu.forEach(d => { d.dishes.forEach((dd, i) => { if(dd.name === newDish.name || (recipes[idx] && dd.name === recipes[idx].name)) d.dishes[i] = newDish; }); });
        } else { recipes.push(newDish); }
        localStorage.setItem('myRecipes_v6_plus', JSON.stringify(recipes));
        saveAndRender();
        cancelEdit();
        if(document.getElementById('editSource').value === 'manager') renderManagerList();
    }

    // --- 菜单操作 ---
    function openAction(dIdx, dishIdx) {
        activeDayIdx = dIdx; activeDishIdx = dishIdx;
        document.getElementById('modalAction').style.display = 'flex';
    }
    function doReroll() {
        let current = currentMenu[activeDayIdx].dishes[activeDishIdx];
        let type = current.type || 'meat';
        let pool = recipes.filter(r => r.type === type && r.name !== current.name);
        if(!pool.length) pool = recipes.filter(r => r.type === type);
        currentMenu[activeDayIdx].dishes[activeDishIdx] = pool[Math.floor(Math.random()*pool.length)];
        saveAndRender();
        closeModal('modalAction');
    }
    function doSetTakeout() {
        currentMenu[activeDayIdx].dishes[activeDishIdx] = { name: "外卖", type: "out", ing: "" };
        saveAndRender();
        closeModal('modalAction');
    }
    function openEditorFromMenu() {
        let current = currentMenu[activeDayIdx].dishes[activeDishIdx];
        if(current.name === '外卖') return alert("外卖不可编辑");
        let idx = recipes.findIndex(r => r.name === current.name);
        if(idx === -1) return alert("库里没找到这道菜");
        openEditor(idx, 'menu');
    }
    function openManualSelect() {
        closeModal('modalAction');
        document.getElementById('modalSelect').style.display = 'flex';
        renderSelectList();
    }
    function renderSelectList() {
        const list = document.getElementById('selList');
        const search = document.getElementById('selSearch').value.toLowerCase();
        list.innerHTML = "";
        recipes.filter(r => r.name.includes(search)).forEach(r => {
            let div = document.createElement('div');
            div.className = 'mgr-item';
            div.innerHTML = `<div><span class="badge b-${r.type}">${r.type}</span> <b>${r.name}</b></div>`;
            div.onclick = () => {
                currentMenu[activeDayIdx].dishes[activeDishIdx] = r;
                saveAndRender();
                closeModal('modalSelect');
            };
            list.appendChild(div);
        });
    }

    // --- 工具 ---
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openFocusMode() {
        if(!currentMenu.length) return alert("先生成菜单");
        const con = document.getElementById('focusContent');
        document.getElementById('focusMode').style.display = 'block';
        con.innerHTML = "";
        currentMenu.forEach(item => {
            con.innerHTML += `<h2 style="border-bottom:2px solid var(--primary);color:var(--primary);">${item.day}</h2>`;
            item.dishes.forEach(d => {
                let link = d.link ? `<br><a href="${d.link}" target="_blank">📺 看教程</a>` : '';
                con.innerHTML += `<div style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:10px;"><b style="font-size:18px;">${d.name}</b><div style="color:#666; margin-top:5px;">${d.ing}</div>${link}</div>`;
            });
        });
    }
    function openSync() { document.getElementById('modalSync').style.display = 'flex'; }
    function doExport() {
        let code = btoa(unescape(encodeURIComponent(JSON.stringify(recipes))));
        document.getElementById('syncData').value = code; document.getElementById('syncData').select(); document.execCommand('copy'); alert("已复制");
    }
    function doImport() {
        try {
            recipes = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('syncData').value))));
            localStorage.setItem('myRecipes_v6_plus', JSON.stringify(recipes));
            alert("导入成功"); location.reload();
        } catch(e) { alert("代码无效"); }
    }
    function copyShop() {
        let t = document.createElement('textarea'); t.value = document.getElementById('shopList').innerText; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); alert("已复制");
    }
    function clearAll() {
        if(confirm("确定重置菜单和日期吗？")) {
            currentMenu = []; selectedDays = []; document.querySelectorAll('.day-opt').forEach(d=>d.classList.remove('selected')); saveAndRender();
        }
    }
</script>
</body>
</html>
